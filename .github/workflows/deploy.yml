name: Deploy Backend

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Verify key
        run: |
          ssh-keygen -y -f ~/.ssh/id_ed25519 | ssh-keygen -lf - && echo "KEY OK" || echo "KEY BROKEN"

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' << 'EOF'
            export PATH="/home/deploy/.nvm/versions/node/v24.16.0/bin:$PATH"
            cd /var/www/erp/erp-test
            git pull origin master
            pnpm install
            pnpm --filter @erp/shared build
            pnpm --filter back migration:up
            pnpm --filter front-end build
            pm2 restart erp-api-new
          EOF