name: Verify and Deploy API and Web

on:
  push:
    branches: [master]
  # `verify` only — the `deploy` job below is gated to push and dispatch. Without this, the first
  # run of any change to this file WAS the deploy it describes: the workflow had no trigger a pull
  # request could reach, so a branch touching it landed on master untested and went straight to
  # the host. Now the half that builds, typechecks and migrates from nothing answers on the pull
  # request, where a mistake costs a red check instead of a release.
  pull_request:
    branches: [master]
  workflow_dispatch:

# Deploys are serialised, never cancelled: a run interrupted during `migration:up` leaves a
# database state no later run can reason about. A second push waits for the first to finish.
#
# Pull requests must NOT share that group. `cancel-in-progress: false` means queue, not skip, so a
# PR sitting in `deploy-production` would hold a real deploy behind a run that deploys nothing.
# They get a per-branch group instead, and there they SHOULD cancel: a superseded push to a PR
# makes the run under way irrelevant, and it is holding a postgres service container to do it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verify-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything that can say "do not ship this" runs here, on a throwaway database, before a
  # single command touches the server. The suites must never run on the production host: they
  # call refreshDatabase(), which drops and recreates every table in whatever database the
  # ambient environment names.
  # NOTE: the suites do not run here. `pnpm --filter back run test` (11.8 min) and the frontend
  # suite inside `front-end run ci` (6.9 of its 7 min) were removed to get a deploy under 6 minutes
  # instead of 23 — 81% of the wall time was the two suites. What remains are the checks that are
  # cheap and that only CI can make: the migrations build the schema from nothing, the container
  # resolves every provider, and everything typechecks.
  #
  # What that gives up, so nobody has to rediscover it: no run of this workflow now asserts the
  # business rules — company isolation, the append-only ledgers, reserve/release arithmetic — or
  # `back/src/seed/deploy-creates-no-accounts.spec.ts`, which is the only thing standing between a
  # push and a deploy that creates a loginable administrator. A regression in any of those reaches
  # production green. Run `pnpm --filter back run test` before merging anything that touches them.
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: erp
      DB_PASSWORD: erp

    steps:
      - uses: actions/checkout@v4

      # No root package.json in this workspace, so the version cannot be inferred.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The other two packages import @erp/shared as a built package, not as source.
      - run: pnpm --filter @erp/shared build

      # The suites build their schema from the ENTITIES; production builds it from the
      # MIGRATIONS. A migration that forgets what an entity gained is invisible to a green
      # suite and fails on the server, mid-deploy, with the database half-moved. Running the
      # migrations against an empty database is the only thing that catches that here.
      - name: Migrations build the schema from nothing
        run: |
          PGPASSWORD=erp createdb -h localhost -U erp erp_ci
          pnpm --filter back migration:up
        env:
          DB_NAME: erp_ci

      # Specs construct services by hand, so an unresolvable provider passes the whole suite
      # and fails at startup — after pm2 has already killed the running API. Booting the real
      # container against the just-migrated database catches it while it is still cheap.
      - name: Container resolves every provider
        run: pnpm --filter back boot:check
        env:
          DB_NAME: erp_ci

      # `tsconfig.build.json` excludes `scripts/`, so `nest build` never typechecks the scripts a
      # deploy and an operator both run. Until this step existed, a type error there surfaced when
      # ts-node compiled the file — in front of whoever ran the command.
      - name: Backend scripts typecheck
        run: pnpm --filter back typecheck:scripts

      # The backend's only full typecheck BEFORE the host attempts it. vitest transpiles through
      # swc and checks no types; `typecheck:scripts` covers `scripts/` alone. Until this step
      # existed, `nest build` on the server was the first thing to typecheck `back/src` — so a type
      # error surfaced mid-deploy, after `migration:up` had already moved the database, with `dist`
      # deleted by `deleteOutDir` and no build left to replace it.
      - name: Backend builds and typechecks
        run: pnpm --filter back build

      # `typecheck`, not `ci`: `ci` is typecheck + suite, and the suites no longer run here.
      # vue-tsc alone is ~10s of the ~7 minutes that step used to take.
      - name: Frontend typechecks
        run: pnpm --filter front-end typecheck

  deploy:
    needs: verify
    # Two conditions, both allowlists.
    #
    # The event: `!= 'pull_request'` would hand production to whatever trigger someone adds next;
    # this way a new trigger has to opt in to touching the host.
    #
    # The repository: this same file lives in phetaiBTC/erp-test and phetaiBTC/erp-production,
    # which hold the same secrets and therefore reach the same host. Both fired on every push for
    # months, minutes apart, and nothing serialised them — `concurrency` is scoped to one
    # repository and cannot see the other. It stayed invisible while the two trees were identical,
    # and stopped being invisible the day they drifted: a deploy finished at 06:21:35 and
    # overwrote, with a bundle built from a commit three behind, the front-end that a deploy at
    # 06:18:47 had just shipped. Login asked `http://localhost:3000` for every request afterwards,
    # and the evidence pointed at everything except a second pipeline.
    #
    # `erp-production` is named here because it is the one whose deploys actually reach the site.
    # That is measured, not assumed, and it is the opposite of what the repository names suggest:
    # three successive `erp-test` deploys (05:36, 06:18, 07:07) left the served `index.html`
    # untouched at `last-modified 06:20:22`, while the `erp-production` deploy that finished
    # 07:35:17 changed it, the bundle hash with it, and fixed login in the same stroke. The two
    # most likely hold different `FOLDER_NAME` secrets and so write to different directories, with
    # nginx and pm2 reading `erp-production`'s — but that was never confirmed on the host, so treat
    # the mapping as observed behaviour rather than an explanation.
    #
    # Before changing this line, check which repository the site actually follows. Deploying from
    # the wrong one is silent: every check is green and nothing on the site moves.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.repository == 'phetaiBTC/erp-production'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Verify key
        # No `|| echo`: a key that cannot be read must fail here, where the message names the
        # problem, rather than one step later as an opaque SSH error.
        run: ssh-keygen -y -f ~/.ssh/id_ed25519 | ssh-keygen -lf -

      - name: Deploy
        # ServerAlive*: the build steps below run for minutes without writing a byte to the
        # connection, and a silent connection is what an idle timeout collects. Without these the
        # deploy dies as `client_loop: send disconnect: Broken pipe` — an ssh failure wearing the
        # costume of a build failure, at whatever step happened to be running.
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' << 'EOF'
            # The whole point of this deploy: stop at the first failure instead of running on and
            # reporting the exit code of `pm2 restart` as if it were the outcome of the deploy.
            set -euo pipefail

            # `bash -s` over ssh is non-interactive, so it never reads .bashrc — nvm has to be
            # sourced by hand. Deliberately not fatal when it is absent: nvm is one way to get
            # node onto PATH, a system install is another, and only the second half of this
            # script cares which. `set -e` does not trip here — the failing command is not the
            # last in the && list — so a machine without nvm carries on with the node it has.
            export NVM_DIR="/home/deploy/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /var/www/erp/erp-${{secrets.FOLDER_NAME}}
            # This host reaches github.com only intermittently: a deploy died here with
            # `connect to host github.com port 22: Connection timed out` while the same fetch,
            # run by hand on the same box minutes later, succeeded. The host's ~/.ssh/config now
            # pins ssh.github.com:443 and IPv4; the retry covers what is left, because a fetch
            # that lost a TCP connection is not a reason to abandon a deploy — nothing has
            # touched the database yet. A failure that survives three attempts says so plainly,
            # rather than leaving git's generic "correct access rights" message to imply the
            # deploy key is at fault.
            export GIT_SSH_COMMAND="ssh -o ConnectTimeout=10"
            for attempt in 1 2 3; do
              git fetch origin master && break
              [ "$attempt" = 3 ] && { echo "git fetch failed 3x: cannot reach github.com from this host" >&2; exit 1; }
              sleep $((attempt * 5))
            done
            # The COMMIT, not `origin/master`: the verify job went green on this exact sha, and a
            # push landing between the two jobs would otherwise deploy source nothing has checked.
            # An ancestor of master stays reachable after a later push, so serialised deploys still
            # each land their own commit.
            git reset --hard ${{ github.sha }}
            # Frozen, so production runs the versions the suites ran against. NOT --prod: the
            # migration step below runs through the MikroORM CLI with useTsNode, reading
            # src/mikro-orm.config.ts and src/migrations/*.ts, so devDependencies must stay.
            pnpm install --frozen-lockfile
            pnpm --filter @erp/shared build
            pnpm --filter back migration:up
            # Migrations bring the slice's tables; its permission codes live in TypeScript and
            # reach the database only here. A code with no row is invisible to the RBAC admin and
            # rejected when granted, so the endpoints behind it answer 403 to everyone. This is the
            # catalog-only command — never `seeder:run`, which would also create a demo company,
            # roles, and loginable accounts. The check then refuses to restart on a short catalog.
            # `bootstrap:admin` is barred here for the same reason and a sharper one: its single
            # account holds the entire catalog. An administrator that can come into existence on a
            # push is one that came into existence unobserved. It is run by a person, on the host,
            # once — see back/README.md. Asserted, not merely stated, by
            # back/src/seed/deploy-creates-no-accounts.spec.ts.
            pnpm --filter back permissions:sync
            pnpm --filter back permissions:check
            pnpm --filter back seed:prod
            # Peaks at ~825 MB resident for 697 files, and `pnpm --filter front-end bundle` below
            # adds ~1.02 GB of its own — on a box also running postgres and the live API. A deploy
            # died right here as `Killed` / exit 137: SIGKILL from the kernel's OOM killer, not a
            # compile error, with no file and no line to fix. THE HOST NEEDS SWAP. See
            # back/README.md ("Production host: the builds run here, so give them room"), which
            # also records why `--max-old-space-size` does not substitute for it and why swc does
            # not either. The typecheck this performs is no longer the first: the verify job runs
            # the same build on this same commit before anything here starts.
            # `build:host`, not `build`: the same compile without the type check (`noCheck`), which the
            # verify job already ran on this exact commit. The emit is byte-identical — checked file
            # by file, 459 of 459 — at ~420 MB peak instead of ~610 MB. Two deploys of 99cf080 died
            # here as `Killed` / exit 137 with the full build; this buys headroom, and swap (see
            # back/README.md) is still the real fix.
            pnpm --filter back build:host
            # `bundle`, not `build`: build is typecheck + bundle, and vue-tsc is the heaviest
            # thing this server is ever asked to do — 1.1 GB resident against vite's 717 MB. The
            # verify job already ran that exact typecheck on this exact commit, so a failure here
            # is one the deploy could never reach. Paying for it again buys nothing and costs the
            # memory headroom the box does not have.
            NODE_OPTIONS="--max-old-space-size=1536" pnpm --filter front-end bundle
            pm2 restart erp-api-new
          EOF
