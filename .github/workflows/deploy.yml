name: Verify and Deploy API and Web

on:
  push:
    branches: [master]
  # `verify` only — the `deploy` job below is gated to push and dispatch. Without this, the first
  # run of any change to this file WAS the deploy it describes: the workflow had no trigger a pull
  # request could reach, so a branch touching it landed on master untested and went straight to
  # the host. Now the half that builds, typechecks, migrates from nothing and packages the
  # artifacts answers on the pull request, where a mistake costs a red check instead of a release.
  pull_request:
    branches: [master]
  workflow_dispatch:

# Deploys are serialised, never cancelled: a run interrupted during `migration:up` leaves a
# database state no later run can reason about. A second push waits for the first to finish.
#
# Pull requests must NOT share that group. `cancel-in-progress: false` means queue, not skip, so a
# PR sitting in `deploy-production` would hold a real deploy behind a run that deploys nothing.
# They get a per-branch group instead, and there they SHOULD cancel: a superseded push to a PR
# makes the run under way irrelevant, and it is holding a postgres service container to do it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verify-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything that can say "do not ship this" runs here, on a throwaway database, before a
  # single command touches the server. The suites must never run on the production host: they
  # call refreshDatabase(), which drops and recreates every table in whatever database the
  # ambient environment names.
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: erp
      DB_PASSWORD: erp

    steps:
      - uses: actions/checkout@v4

      # No root package.json in this workspace, so the version cannot be inferred.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The other two packages import @erp/shared as a built package, not as source.
      - run: pnpm --filter @erp/shared build

      - name: Backend suite
        run: pnpm --filter back run test
        env:
          DB_NAME: erp_test

      # The suites build their schema from the ENTITIES; production builds it from the
      # MIGRATIONS. A migration that forgets what an entity gained is invisible to a green
      # suite and fails on the server, mid-deploy, with the database half-moved. Running the
      # migrations against an empty database is the only thing that catches that here.
      - name: Migrations build the schema from nothing
        run: |
          PGPASSWORD=erp createdb -h localhost -U erp erp_ci
          pnpm --filter back migration:up
        env:
          DB_NAME: erp_ci

      # Specs construct services by hand, so an unresolvable provider passes the whole suite
      # and fails at startup — after pm2 has already killed the running API. Booting the real
      # container against the just-migrated database catches it while it is still cheap.
      - name: Container resolves every provider
        run: pnpm --filter back boot:check
        env:
          DB_NAME: erp_ci

      # `tsconfig.build.json` excludes `scripts/`, so `nest build` never typechecks the scripts a
      # deploy and an operator both run. Until this step existed, a type error there surfaced when
      # ts-node compiled the file — in front of whoever ran the command.
      - name: Backend scripts typecheck
        run: pnpm --filter back typecheck:scripts

      # The backend's only full typecheck, AND the build the host now runs on: nothing compiles
      # `back/src` on the server any more. vitest transpiles through swc and checks no types;
      # `typecheck:scripts` covers `scripts/` alone. So until this step existed, `nest build` ON
      # THE SERVER was the first thing to typecheck `back/src` — a type error surfaced mid-deploy,
      # after `migration:up` had moved the database, with `dist` already deleted by `deleteOutDir`
      # and no build left to replace it.
      - name: Backend builds and typechecks
        run: pnpm --filter back build

      # typecheck + suite. `run` is required: bare `ci` collides with a pnpm command of its own.
      - name: Frontend typecheck and suite
        run: pnpm --filter front-end run ci

      # `bundle`, not `build`: `build` is typecheck + bundle and the step above already ran that
      # exact typecheck on this exact commit. Measured at ~1.02 GB peak resident — the single
      # heaviest thing in this pipeline, and the reason the host no longer runs it.
      - name: Frontend bundles
        run: pnpm --filter front-end bundle

      # The host compiles nothing now: it installs dependencies, runs migrations through ts-node,
      # and serves what this job built. Every compile happens here, on a runner with memory to
      # spare, from the same commit the suites just went green on.
      #
      # shared/dist is in here because `back` imports `@erp/shared` in 48 files and resolves it to
      # `shared/dist/index.js` — the ts-node migration step on the host needs it present before it
      # can even load `mikro-orm.config.ts`.
      - name: Package the built output for the host
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            shared/dist
            back/dist
            front-end/dist
          if-no-files-found: error
          retention-days: 5

  deploy:
    needs: verify
    # An allowlist on purpose. `!= 'pull_request'` would hand production to whatever trigger
    # someone adds next; this way a new trigger has to opt in to touching the host.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Named once. Both the ssh heredocs are quoted — the host never sees a local variable — so
      # these reach the remote script through `${{ env.ROOT }}`, substituted before ssh is called.
      ROOT: /var/www/erp/erp-${{ secrets.FOLDER_NAME }}
      SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Verify key
        # No `|| echo`: a key that cannot be read must fail here, where the message names the
        # problem, rather than one step later as an opaque SSH error.
        run: ssh-keygen -y -f ~/.ssh/id_ed25519 | ssh-keygen -lf -

      - name: Collect the built output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: incoming

      # Source first, artifacts second, database third, restart last — so that every step which
      # can still fail does so while the running API is untouched.
      #
      # ServerAlive*: these steps can run for minutes without writing a byte to the connection,
      # and a silent connection is what an idle timeout collects. Without them the deploy dies as
      # `client_loop: send disconnect: Broken pipe` — an ssh failure wearing the costume of a
      # build failure, at whatever step happened to be running.
      - name: Sync source and install dependencies
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$SSH_TARGET" 'bash -s' << 'EOF'
            set -euo pipefail

            # `bash -s` over ssh is non-interactive, so it never reads .bashrc — nvm has to be
            # sourced by hand. Deliberately not fatal when it is absent: nvm is one way to get
            # node onto PATH, a system install is another, and only the second half of this
            # script cares which. `set -e` does not trip here — the failing command is not the
            # last in the && list — so a machine without nvm carries on with the node it has.
            export NVM_DIR="/home/deploy/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd "${{ env.ROOT }}"
            # This host reaches github.com only intermittently: a deploy died here with
            # `connect to host github.com port 22: Connection timed out` while the same fetch,
            # run by hand on the same box minutes later, succeeded. The host's ~/.ssh/config now
            # pins ssh.github.com:443 and IPv4; the retry covers what is left, because a fetch
            # that lost a TCP connection is not a reason to abandon a deploy — nothing has
            # touched the database yet. A failure that survives three attempts says so plainly,
            # rather than leaving git's generic "correct access rights" message to imply the
            # deploy key is at fault.
            export GIT_SSH_COMMAND="ssh -o ConnectTimeout=10"
            for attempt in 1 2 3; do
              git fetch origin master && break
              [ "$attempt" = 3 ] && { echo "git fetch failed 3x: cannot reach github.com from this host" >&2; exit 1; }
              sleep $((attempt * 5))
            done
            # The COMMIT, not `origin/master`. The `dist` shipped below was compiled from this
            # exact sha by the verify job; resetting to a branch tip would silently pair source
            # from a later push with a build from an earlier one — a mismatch nothing downstream
            # could detect. An ancestor of master stays reachable after a later push, so
            # serialised deploys still each land their own commit.
            git reset --hard ${{ github.sha }}
            # Frozen, so production runs the versions the suites ran against. NOT --prod: the
            # migration step below runs through the MikroORM CLI with useTsNode, reading
            # src/mikro-orm.config.ts and src/migrations/*.ts, so devDependencies must stay.
            pnpm install --frozen-lockfile

            # Staging area for the incoming build. Nothing live is touched until the swap step.
            rm -rf "${{ env.ROOT }}/.deploy-incoming"
            mkdir -p "${{ env.ROOT }}/.deploy-incoming"
          EOF

      # tar over ssh rather than rsync: tar and gzip are on every host, rsync is a package someone
      # has to have installed. One stream, one connection, no per-file round trips.
      - name: Ship the built output
        run: |
          tar czf - -C incoming . |
            ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$SSH_TARGET" \
              "tar xzf - -C ${{ env.ROOT }}/.deploy-incoming"
          # Assert all three landed. The swap step checks too, but failing HERE says the transfer
          # was the problem, rather than reporting it one step later as a missing build.
          ssh "$SSH_TARGET" "ls -d ${{ env.ROOT }}/.deploy-incoming/shared/dist ${{ env.ROOT }}/.deploy-incoming/back/dist ${{ env.ROOT }}/.deploy-incoming/front-end/dist"

      - name: Migrate, swap in the new build, restart
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$SSH_TARGET" 'bash -s' << 'EOF'
            set -euo pipefail
            export NVM_DIR="/home/deploy/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd "${{ env.ROOT }}"

            # Replace a package's dist with the staged one, keeping the outgoing copy as
            # `dist.prev` for a hand rollback. `mv` of a directory is a rename: the running node
            # process holds its files by inode and keeps serving from the old build until pm2
            # restarts it, so there is no window where the live API is reading half a deploy.
            # `if`, not `[ -d x ] && mv`, because a false test as a function's last command is a
            # non-zero return and `set -e` would take the whole script down with it.
            swap_dist() {
              local pkg="$1"
              local incoming="${{ env.ROOT }}/.deploy-incoming/$pkg/dist"
              [ -d "$incoming" ] || { echo "no staged dist for $pkg — refusing to swap" >&2; exit 1; }
              rm -rf "$pkg/dist.prev"
              if [ -d "$pkg/dist" ]; then mv "$pkg/dist" "$pkg/dist.prev"; fi
              mv "$incoming" "$pkg/dist"
            }

            # shared/dist goes in FIRST and alone: `back` imports `@erp/shared` in 48 files and
            # resolves it to `shared/dist/index.js`, so ts-node cannot even load
            # `mikro-orm.config.ts` without it. The migrations below are the first thing that
            # needs it.
            swap_dist shared

            pnpm --filter back migration:up
            # Migrations bring the slice's tables; its permission codes live in TypeScript and
            # reach the database only here. A code with no row is invisible to the RBAC admin and
            # rejected when granted, so the endpoints behind it answer 403 to everyone. This is the
            # catalog-only command — never `seeder:run`, which would also create a demo company,
            # roles, and loginable accounts. The check then refuses to restart on a short catalog.
            # `bootstrap:admin` is barred here for the same reason and a sharper one: its single
            # account holds the entire catalog. An administrator that can come into existence on a
            # push is one that came into existence unobserved. It is run by a person, on the host,
            # once — see back/README.md. Asserted, not merely stated, by
            # back/src/seed/deploy-creates-no-accounts.spec.ts.
            pnpm --filter back permissions:sync
            pnpm --filter back permissions:check
            pnpm --filter back seed:prod

            # Only now, with the database moved and every command that could fail behind us.
            swap_dist back
            swap_dist front-end
            rm -rf "${{ env.ROOT }}/.deploy-incoming"

            pm2 restart erp-api-new
          EOF
