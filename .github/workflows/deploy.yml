name: Deploy API and Web

on:
  push:
    branches: [master]
  workflow_dispatch:

# Deploys are serialised, never cancelled: a run interrupted during `migration:up` leaves a
# database state no later run can reason about. A second push waits for the first to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Everything that can say "do not ship this" runs here, on a throwaway database, before a
  # single command touches the server. The suites must never run on the production host: they
  # call refreshDatabase(), which drops and recreates every table in whatever database the
  # ambient environment names.
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: erp
      DB_PASSWORD: erp

    steps:
      - uses: actions/checkout@v4

      # No root package.json in this workspace, so the version cannot be inferred.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The other two packages import @erp/shared as a built package, not as source.
      - run: pnpm --filter @erp/shared build

      - name: Backend suite
        run: pnpm --filter back run test
        env:
          DB_NAME: erp_test

      # The suites build their schema from the ENTITIES; production builds it from the
      # MIGRATIONS. A migration that forgets what an entity gained is invisible to a green
      # suite and fails on the server, mid-deploy, with the database half-moved. Running the
      # migrations against an empty database is the only thing that catches that here.
      - name: Migrations build the schema from nothing
        run: |
          PGPASSWORD=erp createdb -h localhost -U erp erp_ci
          pnpm --filter back migration:up
        env:
          DB_NAME: erp_ci

      # Specs construct services by hand, so an unresolvable provider passes the whole suite
      # and fails at startup — after pm2 has already killed the running API. Booting the real
      # container against the just-migrated database catches it while it is still cheap.
      - name: Container resolves every provider
        run: pnpm --filter back boot:check
        env:
          DB_NAME: erp_ci

      # typecheck + suite. `run` is required: bare `ci` collides with a pnpm command of its own.
      - name: Frontend typecheck and suite
        run: pnpm --filter front-end run ci

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Verify key
        # No `|| echo`: a key that cannot be read must fail here, where the message names the
        # problem, rather than one step later as an opaque SSH error.
        run: ssh-keygen -y -f ~/.ssh/id_ed25519 | ssh-keygen -lf -

      - name: Deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' << 'EOF'
            # The whole point of this deploy: stop at the first failure instead of running on and
            # reporting the exit code of `pm2 restart` as if it were the outcome of the deploy.
            set -euo pipefail

            export NVM_DIR="/home/deploy/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "nvm not found at $NVM_DIR/nvm.sh" >&2
              exit 1
            fi

            cd /var/www/erp/erp-${{secrets.FOLDER_NAME}}
            git fetch origin master
            git reset --hard origin/master
            # Frozen, so production runs the versions the suites ran against. NOT --prod: the
            # migration step below runs through the MikroORM CLI with useTsNode, reading
            # src/mikro-orm.config.ts and src/migrations/*.ts, so devDependencies must stay.
            pnpm install --frozen-lockfile
            pnpm --filter @erp/shared build
            pnpm --filter back migration:up
            # Migrations bring the slice's tables; its permission codes live in TypeScript and
            # reach the database only here. A code with no row is invisible to the RBAC admin and
            # rejected when granted, so the endpoints behind it answer 403 to everyone. This is the
            # catalog-only command — never `seeder:run`, which would also create a demo company,
            # roles, and loginable accounts. The check then refuses to restart on a short catalog.
            pnpm --filter back permissions:sync
            pnpm --filter back permissions:check
            pnpm --filter back seed:prod
            pnpm --filter back build
            NODE_OPTIONS="--max-old-space-size=1536" pnpm --filter front-end build
            pm2 restart erp-api-new
          EOF
